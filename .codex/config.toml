[mcp_servers.local-figma-bridge-poc]
command = "node"
args = ["mcp/server.mjs"]
cwd = "../.research/local-figma-bridge-poc"
startup_timeout_sec = 30
tool_timeout_sec = 45
default_tools_approval_mode = "writes"
enabled = false
enabled_tools = [
  "figma_status",
  "figma_read_document",
  "figma_create_poc",
  "figma_create_text",
  "figma_set_layout",
  "figma_update_poc",
  "figma_create_prototype_sample",
  "figma_export_poc",
  "figma_delete_poc_owned",
]
