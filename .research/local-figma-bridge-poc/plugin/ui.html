<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Codex Figma Bridge POC</title>
    <style>
      :root { color-scheme: light; font: 12px/1.45 Inter, system-ui, sans-serif; }
      body { margin: 0; padding: 12px 14px; color: #202633; background: #f8f9fb; }
      .row { display: flex; align-items: center; gap: 8px; }
      #dot { width: 8px; height: 8px; border-radius: 50%; background: #d89b25; }
      #status { font-weight: 600; }
      #details { margin-top: 5px; color: #5c6574; overflow-wrap: anywhere; }
      #url { margin-top: 7px; color: #788292; font-size: 10px; }
      #pairing-panel { margin-top: 9px; padding-top: 8px; border-top: 1px solid #e1e5ec; }
      #pairing-label { display: block; margin-bottom: 4px; color: #5c6574; }
      #pairing-row { display: flex; gap: 6px; }
      #pairing-code { box-sizing: border-box; min-width: 0; flex: 1; padding: 6px 7px; border: 1px solid #cbd2dc; border-radius: 5px; font: inherit; }
      #pairing-button { padding: 6px 9px; border: 0; border-radius: 5px; color: #fff; background: #315fce; font: inherit; }
      #pairing-button:disabled { opacity: .55; }
      #pairing-help { margin-top: 4px; color: #788292; font-size: 10px; }
    </style>
  </head>
  <body>
    <div class="row"><span id="dot"></span><span id="status">Connecting to local Codex…</span></div>
    <div id="details">Waiting for the loopback MCP server.</div>
    <div id="pairing-panel">
      <label id="pairing-label" for="pairing-code">One-time code from figma_pairing_begin</label>
      <div id="pairing-row">
        <input id="pairing-code" type="password" inputmode="text" autocomplete="off" spellcheck="false" maxlength="80" aria-label="One-time pairing code" />
        <button id="pairing-button" type="button">Pair</button>
      </div>
      <div id="pairing-help">Pairing enables scoped writes for this local Figma client.</div>
    </div>
    <div id="url">ws://localhost:41731 → 127.0.0.1 · no REST / no token</div>

      // END EMBEDDED HMAC BUNDLE
      const WS_URL = "ws://localhost:41731";
      const WORKSPACE_ID = "protype-code-local";
      const TASK_ID = "local-figma-bridge-poc";
      const PROTOCOL_VERSION = "1";
      const ALLOWED_COMMANDS = new Set([
        "status", "read_document", "create_poc", "create_text", "set_layout",
        "update_poc", "create_prototype_sample", "export_poc", "delete_poc_owned",
        "scope_read_node", "scope_create_frame", "scope_update_frame",
        "scope_delete_node", "scope_set_prototype",
        "scope_create_foreign_fixture", "scope_delete_foreign_fixture",
        "scope_design_plan", "scope_design_apply", "scope_design_audit", "scope_design_export_png",
        "scope_design_text_plan", "scope_design_text_apply",
        "scope_design_assets_plan", "scope_design_asset_stage", "scope_design_asset_commit",
      ]);
      const statusEl = document.getElementById("status");
      const detailsEl = document.getElementById("details");
      const dotEl = document.getElementById("dot");
      const pairingPanel = document.getElementById("pairing-panel");
      const pairingCodeEl = document.getElementById("pairing-code");
      const pairingButton = document.getElementById("pairing-button");
      let socket = null;
      let reconnectTimer = null;
      let heartbeatTimer = null;
      let session = null;
      let connectionId = null;
      let ready = false;
      let authenticated = false;
      let serverId = null;
      let authProofContext = null;
      let pendingPairingRecord = null;
      const uiPending = new Map();

      function setStatus(text, color, details) {
        statusEl.textContent = text;
        dotEl.style.background = color;
        if (details !== undefined) detailsEl.textContent = details;
      }

      function postToMain(pluginMessage) {
        parent.postMessage({ pluginMessage }, "*");
      }

      function stopTimers() {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        if (heartbeatTimer) clearInterval(heartbeatTimer);
        reconnectTimer = null;
        heartbeatTimer = null;
      }

      function closePending() {
        uiPending.clear();
      }

      function updatePairingPanel() {
        pairingPanel.hidden = authenticated;
        pairingButton.disabled = !ready || authenticated || !socket || socket.readyState !== WebSocket.OPEN;
      }

      function decodeBase64Url(value) {
        const base64 = value.replace(/-/g, "+").replace(/_/g, "/");
        const padded = base64 + "=".repeat((4 - base64.length % 4) % 4);
        return Uint8Array.from(atob(padded), (character) => character.charCodeAt(0));
      }

      function encodeBase64Url(value) {
        let binary = "";
        for (const byte of new Uint8Array(value)) binary += String.fromCharCode(byte);
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }

      function pairingPayload(fields, role) {
        return [fields.protocolVersion, fields.serverId, fields.clientId, fields.pairingId, fields.nonce, role].join("\n");
      }

      async function pairingProof(secret, fields, role) {
        const keyBytes = decodeBase64Url(secret);
        const payloadBytes = new TextEncoder().encode(pairingPayload(fields, role));
        if (globalThis.crypto?.subtle) {
          const key = await crypto.subtle.importKey("raw", keyBytes,
            { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
          return encodeBase64Url(await crypto.subtle.sign("HMAC", key, payloadBytes));
        }
        if (typeof globalThis.localBridgeHmacSha256 !== "function") {
          throw new Error("Bundled HMAC is unavailable in the Figma plugin UI.");
        }
        return encodeBase64Url(globalThis.localBridgeHmacSha256(keyBytes, payloadBytes));
      }

      function sameProof(left, right) {
        if (typeof left !== "string" || typeof right !== "string" || left.length !== right.length) return false;
        let mismatch = 0;
        for (let index = 0; index < left.length; index += 1) mismatch |= left.charCodeAt(index) ^ right.charCodeAt(index);
        return mismatch === 0;
      }

      async function handleAuthChallenge(message) {
        const pairing = session?.pairingRecord;
        if (!pairing || message.protocolVersion !== PROTOCOL_VERSION || message.serverId !== serverId ||
            message.clientId !== session.clientId || message.serverId !== pairing.serverId ||
            message.pairingId !== pairing.pairingId || typeof message.nonce !== "string") {
          setStatus("Pairing required", "#d89b25", "The saved pairing does not match this local MCP server.");
          updatePairingPanel();
          return;
        }
        authProofContext = {
          protocolVersion: message.protocolVersion,
          serverId: message.serverId,
          clientId: message.clientId,
          pairingId: message.pairingId,
          nonce: message.nonce,
        };
        try {
          const proof = await pairingProof(pairing.secret, authProofContext, "client");
          if (socket?.readyState !== WebSocket.OPEN) return;
          socket.send(JSON.stringify({ type: "auth_proof", ...authProofContext, proof }));
        } catch (error) {
          setStatus("Pairing authentication failed", "#d64f45", error instanceof Error ? error.message : String(error));
        }
      }

      function scheduleReconnect() {
        if (reconnectTimer) return;
        setStatus("Disconnected — retrying…", "#d89b25", "The MCP server is unavailable; retrying the same local socket.");
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          connect();
        }, 1_500);
      }

      function connect() {
        stopTimers();
        ready = false;
        authenticated = false;
        connectionId = null;
        authProofContext = null;
        closePending("Local MCP connection closed");
        postToMain({ type: "bridge-auth-reset" });
        updatePairingPanel();
        setStatus("Connecting to local Codex…", "#d89b25", "Waiting for the loopback MCP server.");
        socket = new WebSocket(WS_URL);
        socket.addEventListener("open", () => {
          postToMain({ type: "bridge-initialize" });
        });
        socket.addEventListener("message", (event) => {
          let message;
          try { message = JSON.parse(event.data); } catch { return; }
          if (message.type === "welcome") {
            if (!session || message.workspaceId !== WORKSPACE_ID || message.taskId !== TASK_ID ||
                message.sessionId !== session.sessionId || message.clientId !== session.clientId ||
                message.fileIdentity !== session.fileIdentity) {
              socket.close(1008, "Mismatched bridge session");
              return;
            }
            serverId = message.serverId;
            connectionId = message.connectionId;
            postToMain({
              type: "connection-ready",
              workspaceId: WORKSPACE_ID,
              taskId: TASK_ID,
              sessionId: session.sessionId,
              clientId: session.clientId,
              fileIdentity: session.fileIdentity,
              connectionId,
            });
            return;
          }
          if (message.type === "auth_challenge") {
            void handleAuthChallenge(message);
            return;
          }
          if (message.type === "auth_result") {
            if (!message.authenticated || !authProofContext || message.serverId !== serverId ||
                message.clientId !== session?.clientId || message.pairingId !== authProofContext.pairingId ||
                message.nonce !== authProofContext.nonce) {
              authenticated = false;
              postToMain({ type: "bridge-auth-reset" });
              setStatus("Connected · read only", "#d89b25", "Pairing authentication was rejected; writes remain disabled.");
              updatePairingPanel();
              return;
            }
            const pairing = session?.pairingRecord;
            if (!pairing) return;
            void pairingProof(pairing.secret, authProofContext, "server").then((expected) => {
              if (!sameProof(expected, message.serverProof) || socket?.readyState !== WebSocket.OPEN) {
                setStatus("Server authentication failed", "#d64f45", "The local bridge proof did not match the saved pairing.");
                return;
              }
              socket.send(JSON.stringify({ type: "auth_confirm", serverId,
                clientId: session.clientId, pairingId: authProofContext.pairingId,
                nonce: authProofContext.nonce }));
            }).catch((error) => {
              setStatus("Pairing authentication failed", "#d64f45", error instanceof Error ? error.message : String(error));
            });
            return;
          }
          if (message.type === "auth_complete") {
            if (!message.authenticated || !authProofContext || message.serverId !== serverId ||
                message.clientId !== session?.clientId || message.pairingId !== authProofContext.pairingId ||
                message.nonce !== authProofContext.nonce) return;
            authenticated = true;
            postToMain({ type: "bridge-authenticated", serverId, clientId: session.clientId,
              pairingId: message.pairingId, connectionId });
            setStatus("Paired and authenticated", "#23885b",
              `${session.documentName} · ${session.currentPageName} · stable file identity`);
            updatePairingPanel();
            return;
          }
          if (message.type === "pairing_issued") {
            if (message.serverId !== serverId || message.clientId !== session?.clientId ||
                typeof message.pairingId !== "string" || !/^[A-Za-z0-9_-]{43}$/.test(message.secret)) {
              socket.send(JSON.stringify({ type: "pairing_storage_failed", clientId: session?.clientId }));
              return;
            }
            pendingPairingRecord = { serverId: message.serverId, clientId: message.clientId,
              pairingId: message.pairingId, secret: message.secret };
            postToMain({ type: "pairing-persist", clientId: session.clientId,
              pairingRecord: pendingPairingRecord });
            setStatus("Saving pairing", "#d89b25", "Storing the local pairing record in Figma clientStorage.");
            return;
          }
          if (message.type === "pairing_error") {
            pairingButton.disabled = false;
            setStatus("Pairing failed", "#d64f45", `Local bridge rejected the pairing request (${message.code || "unknown"}).`);
            return;
          }
          if (message.type === "pairing_stored_ack") return;
          if (message.type === "request") {
            if (!ready || (!authenticated && !["status", "read_document"].includes(message.command)) || !ALLOWED_COMMANDS.has(message.command) ||
                message.workspaceId !== WORKSPACE_ID || message.taskId !== TASK_ID ||
                message.connectionId !== connectionId || message.sessionId !== session?.sessionId ||
                message.fileIdentity !== session?.fileIdentity || typeof message.requestId !== "string") {
              return;
            }
            postToMain({
              type: "plugin-command",
              workspaceId: message.workspaceId,
              taskId: message.taskId,
              sessionId: message.sessionId,
              fileIdentity: message.fileIdentity,
              connectionId: message.connectionId,
              requestId: message.requestId,
              operationId: message.operationId,
              authorizationId: message.authorizationId,
              revision: message.revision,
              trustedScope: message.trustedScope,
              trustedOwnership: message.trustedOwnership,
              testFixture: message.testFixture,
              command: message.command,
              expectedFileIdentity: message.payload?.expectedFileIdentity,
              payload: message.payload,
            });
            uiPending.set(message.requestId, {
              connectionId,
              sessionId: session.sessionId,
              fileIdentity: session.fileIdentity,
              operationId: message.operationId,
            });
            return;
          }
          if (message.type === "heartbeat_ack" && message.connectionId === connectionId) return;
        });
        socket.addEventListener("close", () => {
          ready = false;
          authenticated = false;
          stopTimers();
          closePending("Local MCP connection closed");
          postToMain({ type: "bridge-auth-reset" });
          updatePairingPanel();
          scheduleReconnect();
        });
        socket.addEventListener("error", () => {
          setStatus("Socket error — retrying…", "#d64f45", "Check that the project MCP server is running on 127.0.0.1:41731.");
        });
      }

      function bytesToBase64(bytes) {
        let binary = "";
        const chunkSize = 0x8000;
        for (let index = 0; index < bytes.length; index += chunkSize) {
          binary += String.fromCharCode(...bytes.subarray(index, index + chunkSize));
        }
        return btoa(binary);
      }

      window.onmessage = (event) => {
        const message = event.data && event.data.pluginMessage;
        if (!message) return;
        if (message.type === "bridge-hello") {
          session = message;
          if (!socket || socket.readyState !== WebSocket.OPEN) return;
          socket.send(JSON.stringify({
            type: "hello",
            protocolVersion: PROTOCOL_VERSION,
            workspaceId: WORKSPACE_ID,
            taskId: TASK_ID,
            sessionId: session.sessionId,
            clientId: session.clientId,
            ...(session.pairingRecord ? {
              serverId: session.pairingRecord.serverId,
              pairingId: session.pairingRecord.pairingId,
            } : {}),
            metadata: {
              fileIdentity: session.fileIdentity,
              fileIdentityQuality: session.fileIdentityQuality,
              documentName: session.documentName,
              currentPageId: session.currentPageId,
              currentPageName: session.currentPageName,
            },
          }));
          return;
        }
        if (message.type === "bridge-initialize-error") {
          setStatus("Plugin initialization failed", "#d64f45", message.error || "Figma clientStorage could not be loaded.");
          return;
        }
        if (message.type === "plugin-ready") {
          if (message.connectionId !== connectionId || message.sessionId !== session?.sessionId ||
              message.clientId !== session?.clientId) return;
          ready = true;
          socket.send(JSON.stringify({
            type: "ready",
            workspaceId: WORKSPACE_ID,
            taskId: TASK_ID,
            sessionId: session.sessionId,
            clientId: session.clientId,
            fileIdentity: session.fileIdentity,
            connectionId,
          }));
          setStatus("Connected · read only", "#23885b",
            `${session.documentName} · ${session.currentPageName} · ${session.fileIdentityQuality} file identity`);
          updatePairingPanel();
          heartbeatTimer = setInterval(() => {
            if (socket.readyState === WebSocket.OPEN) {
              socket.send(JSON.stringify({ type: "heartbeat", connectionId, sessionId: session.sessionId }));
            }
          }, 10_000);
          return;
        }
        if (message.type === "pairing-stored") {
          if (!pendingPairingRecord || message.serverId !== pendingPairingRecord.serverId ||
              message.clientId !== pendingPairingRecord.clientId || message.pairingId !== pendingPairingRecord.pairingId) return;
          session.pairingRecord = pendingPairingRecord;
          socket.send(JSON.stringify({ type: "pairing_stored", serverId: message.serverId,
            clientId: message.clientId, pairingId: message.pairingId }));
          pendingPairingRecord = null;
          return;
        }
        if (message.type === "pairing-storage-error") {
          if (socket?.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ type: "pairing_storage_failed", clientId: message.clientId,
              serverId: message.serverId, pairingId: message.pairingId }));
          }
          pendingPairingRecord = null;
          setStatus("Pairing storage failed", "#d64f45", message.error || "Figma clientStorage write failed.");
          updatePairingPanel();
          return;
        }
        if (message.type === "plugin-result") {
          const pending = uiPending.get(message.requestId);
          if (!pending || pending.connectionId !== connectionId || pending.sessionId !== message.sessionId ||
              pending.fileIdentity !== message.fileIdentity || pending.operationId !== message.operationId) return;
          uiPending.delete(message.requestId);
          if (message.ok && message.result?.bytes) {
            try {
              message.result.bytesBase64 = bytesToBase64(new Uint8Array(message.result.bytes));
              delete message.result.bytes;
            } catch (error) {
              message.ok = false;
              message.error = error instanceof Error ? error.message : String(error);
            }
          }
          socket.send(JSON.stringify({
            type: "result",
            workspaceId: WORKSPACE_ID,
            taskId: TASK_ID,
            connectionId,
            sessionId: pending.sessionId,
            fileIdentity: pending.fileIdentity,
            requestId: message.requestId,
            ...(message.operationId ? { operationId: message.operationId } : {}),
            ok: message.ok === true,
            ...(message.ok ? { result: message.result } : { error: String(message.error || "Figma plugin error").slice(0, 1_000) }),
          }));
          return;
        }
      };

      pairingButton.addEventListener("click", () => {
        const code = pairingCodeEl.value.trim();
        if (!code || !ready || !session || socket?.readyState !== WebSocket.OPEN) return;
        pairingCodeEl.value = "";
        pairingButton.disabled = true;
        socket.send(JSON.stringify({ type: "pairing_code", clientId: session.clientId, code }));
        setStatus("Pairing requested", "#d89b25", "The one-time code is being validated locally.");
      });

      connect();
    </script>
  </body>
</html>
